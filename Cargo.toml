[package]
name = "md-tui-rs"
version = "0.3.0"
edition = "2024"
description = "Terminal markdown reader and HackMD-style split-screen editor with mouse support, clickable links and task lists, fuzzy search, and a directory browser."
license = "MIT"
repository = "https://github.com/zemse/md-tui"
homepage = "https://github.com/zemse/md-tui"
readme = "README.md"
keywords = ["markdown", "tui", "terminal", "viewer", "reader"]
categories = ["command-line-utilities", "text-processing"]
authors = ["Soham Zemse"]

[[bin]]
name = "md"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
open = "5"
unicode-width = "0.2"
walkdir = "2"
ignore = "0.4"
ratatui-image = { version = "11.0.0-alpha.2", default-features = false, features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
