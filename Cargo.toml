[package]
name = "md-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
open = "5"
unicode-width = "0.2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
